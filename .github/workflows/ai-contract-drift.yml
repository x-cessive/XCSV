name: XCSV AI contract drift

on:
  push:
    branches: [main]
    paths:
      - 'AI-START-HERE.md'
      - 'AI-PROVENANCE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'opencode.json'
      - '.agents/rules/**'
      - 'wiki/AI-Start-Here.md'
      - 'wiki/AI-Provenance-and-Doc-Sync.md'
      - 'wiki/AI-Tooling.md'
      - 'wiki/Roadmap.md'
      - 'wiki/Home.md'
      - 'tools/ai-reconcile.ps1'
      - 'tools/ai-commit.ps1'
      - 'tools/build-docs.ps1'
      - 'docs/wiki/AI-Start-Here.md'
      - 'docs/wiki/AI-Provenance-and-Doc-Sync.md'
      - 'docs/wiki/AI-Tooling.md'
      - '.github/workflows/ai-contract-drift.yml'
  pull_request:
    paths:
      - 'AI-START-HERE.md'
      - 'AI-PROVENANCE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'opencode.json'
      - '.agents/rules/**'
      - 'wiki/AI-Start-Here.md'
      - 'wiki/AI-Provenance-and-Doc-Sync.md'
      - 'wiki/AI-Tooling.md'
      - 'wiki/Roadmap.md'
      - 'wiki/Home.md'
      - 'tools/ai-reconcile.ps1'
      - 'tools/ai-commit.ps1'
      - 'tools/build-docs.ps1'
      - 'docs/wiki/AI-Start-Here.md'
      - 'docs/wiki/AI-Provenance-and-Doc-Sync.md'
      - 'docs/wiki/AI-Tooling.md'
      - '.github/workflows/ai-contract-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Verify XCSV-AI-CONTRACT 1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Required files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'AI-START-HERE.md'
            'AI-PROVENANCE.md'
            'CLAUDE.md'
            'AGENTS.md'
            'opencode.json'
            '.agents/rules/00-xcsv-ai-entrypoint.md'
            'wiki/AI-Start-Here.md'
            'wiki/AI-Provenance-and-Doc-Sync.md'
            'wiki/AI-Tooling.md'
            'tools/ai-reconcile.ps1'
            'tools/ai-commit.ps1'
            'tools/build-docs.ps1'
            'docs/wiki/AI-Start-Here.md'
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Contract version markers agree
        shell: bash
        run: |
          set -euo pipefail
          version='XCSV-AI-CONTRACT: 1.0.0'
          for f in AI-START-HERE.md CLAUDE.md AGENTS.md .agents/rules/00-xcsv-ai-entrypoint.md wiki/AI-Start-Here.md docs/wiki/AI-Start-Here.md; do
            grep -Fq "$version" "$f" || { echo "CONTRACT VERSION DRIFT: $f"; exit 1; }
          done

      - name: Provenance policy exists and adapters route to it
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'XCSV-AI-PROVENANCE: 1.0.0' wiki/AI-Provenance-and-Doc-Sync.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' AI-START-HERE.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' CLAUDE.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' AGENTS.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' opencode.json
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' .agents/rules/00-xcsv-ai-entrypoint.md
          grep -Fq 'XCSV-Agent:' tools/ai-commit.ps1
          grep -Fq 'XCSV-Work-ID:' tools/ai-commit.ps1

      - name: Native adapters route to canonical contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'wiki/AI-Start-Here.md' CLAUDE.md
          grep -Fq 'wiki/AI-Start-Here.md' AGENTS.md
          grep -Fq 'wiki/AI-Start-Here.md' opencode.json
          grep -Fq 'AI-Start-Here.md' .agents/rules/00-xcsv-ai-entrypoint.md

      - name: Roadmap and README expose the gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AI / AGENT ROADMAP GATE' wiki/Roadmap.md
          grep -Fq 'AI / AGENT START HERE' README.md
          grep -Fq 'AI / AGENT START HERE' wiki/Home.md

      - name: Documentation state is declared
        shell: bash
        run: |
          set -euo pipefail
          # Assert that wiki/Home.md DECLARES a documentation reconciliation
          # state, not that it holds one specific value. The original gate
          # grepped for 'DIVERGED' literally, which froze a transient
          # pre-reconciliation assumption into a permanent invariant: actually
          # performing the reconciliation the contract mandates would turn the
          # build red. A gate must not make correct work fail.
          if ! grep -Eq 'documentation state: `?(SYNCED|DESKTOP_AHEAD|GITHUB_AHEAD|DIVERGED|UNKNOWN)`?' wiki/Home.md; then
            echo 'wiki/Home.md does not declare a documentation state.'
            echo 'Expected one of: SYNCED, DESKTOP_AHEAD, GITHUB_AHEAD, DIVERGED, UNKNOWN.'
            exit 1
          fi
          # The five states must stay defined in the policy that owns them.
          for s in SYNCED DESKTOP_AHEAD GITHUB_AHEAD DIVERGED UNKNOWN; do
            grep -Fq "$s" wiki/AI-Provenance-and-Doc-Sync.md || {
              echo "STATE DRIFT: $s missing from wiki/AI-Provenance-and-Doc-Sync.md"; exit 1; }
          done

      - name: Site generator publishes AI pages
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'AI-Start-Here'" tools/build-docs.ps1
          grep -Fq "'AI-Provenance-and-Doc-Sync'" tools/build-docs.ps1
          grep -Fq "'AI-Tooling'" tools/build-docs.ps1
          grep -Fq "'XCSV-GUARD-Development-Plan'" tools/build-docs.ps1

      - name: Reconciliation probe stays read-only by contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'READ_ONLY_BOOTSTRAP' tools/ai-reconcile.ps1
          grep -Fq 'git ls-remote' tools/ai-reconcile.ps1
          if grep -Eqi 'git (pull|reset|checkout|merge|rebase)|Remove-Item|Set-Content|Move-Item' tools/ai-reconcile.ps1; then
            echo 'ai-reconcile.ps1 contains a potentially mutating command; review required.'
            exit 1
          fi
