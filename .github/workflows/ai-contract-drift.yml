name: XCSV AI contract drift

on:
  push:
    branches: [main]
    paths:
      - 'AI-START-HERE.md'
      - 'AI-PROVENANCE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'opencode.json'
      - '.gitmodules'
      - '.agents/rules/**'
      - 'addons'
      - 'addons/**'
      - 'catalogue'
      - 'catalogue/**'
      - 'guard'
      - 'guard/**'
      - 'README.md'
      - 'wiki/AI-Start-Here.md'
      - 'wiki/AI-Provenance-and-Doc-Sync.md'
      - 'wiki/AI-Tooling.md'
      - 'wiki/Roadmap.md'
      - 'wiki/Home.md'
      - 'wiki/**'
      - 'tools/ai-reconcile.ps1'
      - 'tools/ai-commit.ps1'
      - 'tools/build-component-inventory.ps1'
      - 'tools/build-docs.ps1'
      - 'tools/check-doc-links.ps1'
      - 'tools/check-docs-generated.ps1'
      - 'tools/sync-all.ps1'
      - 'tools/sync-policy.ps1'
      - 'tools/check-text-safety.ps1'
      - 'tools/xcsv-repository-guardrails.ps1'
      - 'registry/components.json'
      - 'tools/tests/**'
      - '.github/workflows/sync.yml'
      - 'docs/wiki/AI-Start-Here.md'
      - 'docs/wiki/AI-Provenance-and-Doc-Sync.md'
      - 'docs/wiki/AI-Tooling.md'
      - 'docs/wiki/**'
      - '.github/workflows/ai-contract-drift.yml'
  pull_request:
    paths:
      - 'AI-START-HERE.md'
      - 'AI-PROVENANCE.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'opencode.json'
      - '.gitmodules'
      - '.agents/rules/**'
      - 'addons'
      - 'addons/**'
      - 'catalogue'
      - 'catalogue/**'
      - 'guard'
      - 'guard/**'
      - 'README.md'
      - 'wiki/AI-Start-Here.md'
      - 'wiki/AI-Provenance-and-Doc-Sync.md'
      - 'wiki/AI-Tooling.md'
      - 'wiki/Roadmap.md'
      - 'wiki/Home.md'
      - 'wiki/**'
      - 'tools/ai-reconcile.ps1'
      - 'tools/ai-commit.ps1'
      - 'tools/build-component-inventory.ps1'
      - 'tools/build-docs.ps1'
      - 'tools/check-doc-links.ps1'
      - 'tools/check-docs-generated.ps1'
      - 'tools/sync-all.ps1'
      - 'tools/sync-policy.ps1'
      - 'tools/check-text-safety.ps1'
      - 'tools/xcsv-repository-guardrails.ps1'
      - 'registry/components.json'
      - 'tools/tests/**'
      - '.github/workflows/sync.yml'
      - 'docs/wiki/AI-Start-Here.md'
      - 'docs/wiki/AI-Provenance-and-Doc-Sync.md'
      - 'docs/wiki/AI-Tooling.md'
      - 'docs/wiki/**'
      - '.github/workflows/ai-contract-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Verify XCSV-AI-CONTRACT 1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Required files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'AI-START-HERE.md'
            'AI-PROVENANCE.md'
            'CLAUDE.md'
            'AGENTS.md'
            'opencode.json'
            '.agents/rules/00-xcsv-ai-entrypoint.md'
            'wiki/AI-Start-Here.md'
            'wiki/AI-Provenance-and-Doc-Sync.md'
            'wiki/AI-Tooling.md'
            'tools/ai-reconcile.ps1'
            'tools/ai-commit.ps1'
            'tools/build-docs.ps1'
            'docs/wiki/AI-Start-Here.md'
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Contract version markers agree
        shell: bash
        run: |
          set -euo pipefail
          version='XCSV-AI-CONTRACT: 1.0.0'
          for f in AI-START-HERE.md CLAUDE.md AGENTS.md .agents/rules/00-xcsv-ai-entrypoint.md wiki/AI-Start-Here.md docs/wiki/AI-Start-Here.md; do
            grep -Fq "$version" "$f" || { echo "CONTRACT VERSION DRIFT: $f"; exit 1; }
          done

      - name: Provenance policy exists and adapters route to it
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'XCSV-AI-PROVENANCE: 1.0.0' wiki/AI-Provenance-and-Doc-Sync.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' AI-START-HERE.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' CLAUDE.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' AGENTS.md
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' opencode.json
          grep -Fq 'AI-Provenance-and-Doc-Sync.md' .agents/rules/00-xcsv-ai-entrypoint.md
          grep -Fq 'XCSV-Agent:' tools/ai-commit.ps1
          grep -Fq 'XCSV-Work-ID:' tools/ai-commit.ps1

      - name: Native adapters route to canonical contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'wiki/AI-Start-Here.md' CLAUDE.md
          grep -Fq 'wiki/AI-Start-Here.md' AGENTS.md
          grep -Fq 'wiki/AI-Start-Here.md' opencode.json
          grep -Fq 'AI-Start-Here.md' .agents/rules/00-xcsv-ai-entrypoint.md

      - name: Roadmap and README expose the gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AI / AGENT ROADMAP GATE' wiki/Roadmap.md
          grep -Fq 'AI / AGENT START HERE' README.md
          grep -Fq 'AI / AGENT START HERE' wiki/Home.md

      - name: Documentation state is declared
        shell: bash
        run: |
          set -euo pipefail
          # Assert that wiki/Home.md DECLARES a documentation reconciliation
          # state, not that it holds one specific value. The original gate
          # grepped for 'DIVERGED' literally, which froze a transient
          # pre-reconciliation assumption into a permanent invariant: actually
          # performing the reconciliation the contract mandates would turn the
          # build red. A gate must not make correct work fail.
          if ! grep -Eq 'documentation state: `?(SYNCED|DESKTOP_AHEAD|GITHUB_AHEAD|DIVERGED|UNKNOWN)`?' wiki/Home.md; then
            echo 'wiki/Home.md does not declare a documentation state.'
            echo 'Expected one of: SYNCED, DESKTOP_AHEAD, GITHUB_AHEAD, DIVERGED, UNKNOWN.'
            exit 1
          fi
          # The five states must stay defined in the policy that owns them.
          for s in SYNCED DESKTOP_AHEAD GITHUB_AHEAD DIVERGED UNKNOWN; do
            grep -Fq "$s" wiki/AI-Provenance-and-Doc-Sync.md || {
              echo "STATE DRIFT: $s missing from wiki/AI-Provenance-and-Doc-Sync.md"; exit 1; }
          done

      - name: Site generator publishes AI pages
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'AI-Start-Here'" tools/build-docs.ps1
          grep -Fq "'AI-Provenance-and-Doc-Sync'" tools/build-docs.ps1
          grep -Fq "'AI-Tooling'" tools/build-docs.ps1
          grep -Fq "'XCSV-GUARD-Development-Plan'" tools/build-docs.ps1

      - name: Reconciliation probe stays read-only by contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'READ_ONLY_BOOTSTRAP' tools/ai-reconcile.ps1
          grep -Fq 'git ls-remote' tools/ai-reconcile.ps1
          # The probe writes in exactly one place: the temp file it creates to
          # capture git's stderr, which it then cleans up. That is not a
          # mutation of anything the contract protects, but a blanket grep
          # cannot tell it apart from a real one. So assert the file is a
          # genuine temp file first, then exempt only the lines that name it.
          grep -Fq '$errFile = [System.IO.Path]::GetTempFileName()' tools/ai-reconcile.ps1
          if grep -vF 'LiteralPath $errFile' tools/ai-reconcile.ps1 \
              | grep -Eqi 'git (pull|reset|checkout|merge|rebase)|Remove-Item|Set-Content|Move-Item'; then
            echo 'ai-reconcile.ps1 contains a potentially mutating command; review required.'
            exit 1
          fi

      - name: Sync automation cannot absorb human or AI work (XCSV-AI-002)
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/sync-policy.ps1 || { echo 'MISSING: tools/sync-policy.ps1'; exit 1; }
          test -f tools/tests/sync-policy.tests.ps1 || { echo 'MISSING: the sync policy regression suite'; exit 1; }
          # The literal defect: broad staging of the hub root. sync.yml stages
          # 'docs/wiki' explicitly and must keep doing so.
          if grep -Eq 'Invoke-Git[[:space:]]+-C[[:space:]]+\$Root[[:space:]]+add[[:space:]]+-A\b' tools/sync-all.ps1; then
            echo 'sync-all.ps1 stages the hub with `git add -A` - it can absorb uncommitted work.'
            exit 1
          fi
          # sync.yml must stage the regenerated pages by explicit path. Note it
          # also runs `git add -A` inside the throwaway wiki clone, which is
          # correct - that directory contains nothing but copied wiki files - so
          # this asserts the good pattern rather than banning the string.
          grep -Fq 'git add docs/wiki' .github/workflows/sync.yml
          grep -Fq 'BLOCKED_DIRTY_SOURCE' tools/sync-all.ps1
          grep -Fq 'BLOCKED_DIRTY_SOURCE' tools/sync-policy.ps1
          # Automation provenance, and only automation provenance.
          grep -Fq 'XCSV-Agent: automation'      tools/sync-policy.ps1
          grep -Fq 'XCSV-Agent-Role: automation' tools/sync-policy.ps1
          grep -Fq 'XCSV-Work-ID: XCSV-AI-002'   tools/sync-policy.ps1

  sync-policy:
    name: Sync policy regression suite
    # Windows on purpose: the code under test is Windows PowerShell 5.1
    # automation driving a Windows scheduled task. Running it under pwsh on
    # Linux would test a different language edition than the one that actually
    # runs hourly on SOVRAN-1.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Sync policy and provenance tests
        shell: powershell
        run: |
          .\tools\tests\sync-policy.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: No unsafe same-file text rewrites on protected paths
        shell: powershell
        run: |
          .\tools\check-text-safety.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  repository-guardrails:
    name: Repository fabric guardrails
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout required member submodules at XCSV gitlinks
        shell: powershell
        env:
          XCSV_MEMBER_REPO_TOKEN: ${{ secrets.XCSV_MEMBER_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XCSV_MEMBER_REPO_TOKEN)) {
            throw 'XCSV_MEMBER_REPO_TOKEN is required to clone private member repositories for repository-fabric guardrails.'
          }
          $rewriteKey = "url.https://x-access-token:$env:XCSV_MEMBER_REPO_TOKEN@github.com/.insteadOf"
          try {
            git config --global $rewriteKey "https://github.com/"
            git submodule sync --recursive
            git submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            git config --global --unset-all $rewriteKey 2>$null
          }
          $globalConfig = git config --global --list 2>$null
          if ($globalConfig -match 'x-access-token') {
            throw 'Credential-bearing Git URL rewrite remains in global Git configuration after member checkout.'
          }
          git submodule status --recursive

      - name: Verify member checkout credential scrubbed
        shell: powershell
        run: |
          $globalConfig = git config --global --list 2>$null
          if ($globalConfig -match 'x-access-token') {
            throw 'Credential-bearing Git URL rewrite is still present before repository-controlled scripts run.'
          }

      - name: Repository guardrail regression suite
        shell: powershell
        run: |
          .\tools\tests\repository-guardrails.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CI-safe repository guardrail audit
        shell: powershell
        run: |
          $reportJson = .\tools\xcsv-repository-guardrails.ps1 -Mode CI_SAFE_SOURCE_CHECK -RequireMemberSources -FailOnFindings -Json
          $exitCode = $LASTEXITCODE
          $reportJson | Out-File -Encoding utf8 repository-guardrails-report.json
          Get-Content repository-guardrails-report.json
          if ($exitCode -ne 0) { exit $exitCode }

          $report = Get-Content repository-guardrails-report.json -Raw | ConvertFrom-Json
          foreach ($name in @('addons', 'catalogue', 'guard')) {
            $obs = $report.observations.$name
            if ($obs.result -ne 'VERIFIED_AT_OBSERVATION') {
              throw "$name source was not verified: $($obs.detail)"
            }
            if ($obs.sha -ne $obs.expected_gitlink_sha) {
              throw "$name source HEAD $($obs.sha) does not match gitlink $($obs.expected_gitlink_sha)"
            }
            if ($obs.clean -ne $true) {
              throw "$name source is not clean"
            }
          }

          if ($report.sourceReady -ne $true) {
            throw 'sourceReady is false; member-dependent audits did not have authoritative source.'
          }

          foreach ($check in @('registry-completeness', 'cfgexilecustomcode', 'network-messages', 'xm8-ui', 'init-event-scheduler', 'trader-economy', 'mirror-drift')) {
            if ($report.member_dependent_audits_executed -notcontains $check) {
              throw "Member-dependent audit did not execute: $check"
            }
          }

      - name: Documentation generation and link guardrails
        shell: powershell
        run: |
          git diff --quiet -- docs/wiki
          if ($LASTEXITCODE -ne 0) { throw 'docs/wiki has content drift before generated-doc drift check.' }
          .\tools\check-docs-generated.ps1 -Root $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/wiki
          if ($LASTEXITCODE -ne 0) { throw 'Generated docs/wiki output is not committed or has drifted from canonical wiki source.' }
          .\tools\check-doc-links.ps1 -Root $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
